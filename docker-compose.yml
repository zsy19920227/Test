# 本地一键起 MySQL 8 + Redis（可选，便于前端/后端联调）
# 用法：docker compose up -d
# 首次启动会自动执行 backend/sql/init.sql 完成建库建表
services:
  mysql:
    image: mysql:8.0
    container_name: turing-mysql
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: turing_platform
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - turing-mysql-data:/var/lib/mysql
      - ./backend/sql/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_general_ci

  redis:
    image: redis:7-alpine
    container_name: turing-redis
    ports:
      - "6379:6379"
    volumes:
      - turing-redis-data:/data

volumes:
  turing-mysql-data:
  turing-redis-data:
